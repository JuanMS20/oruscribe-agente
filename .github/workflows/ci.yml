name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Una ejecución nueva de la misma rama cancela la que sigue corriendo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint de tests que se saltan
        run: python scripts/lint-tests.py

      - name: Frontend (tests y sintaxis)
        shell: bash
        run: bash scripts/test-frontend.sh

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `-j 1` serializa la COMPILACIÓN, no las pruebas: no aísla nada y en una
      # máquina de 16 núcleos multiplica el tiempo del bucle. El aislamiento va
      # en cada test (su propia carpeta de datos), no en una bandera.
      - name: Pruebas
        run: cargo test --workspace --locked --no-fail-fast

      # #[ignore] porque necesita el binario; sin esto el turno real
      # (app -> arnés -> proveedor -> herramienta -> sesión) no corre en el CI.
      - name: Prueba del turno completo con el proveedor falso
        run: |
          cargo build -p fake-provider --locked
          cargo test -p orus-app --test agent_turno --locked -- --ignored

      - name: Prueba real de la app contra el proveedor y un Sentry falso
        run: |
          cargo build -p orus-server -p fake-provider --locked
          python scripts/e2e-real.py

      - name: Compilar la app para Windows
        env:
          ORUSCRIBE_SENTRY_DSN: ${{ secrets.ORUSCRIBE_SENTRY_DSN }}
        shell: pwsh
        run: |
          if (-not $env:ORUSCRIBE_SENTRY_DSN) { Write-Warning 'ORUSCRIBE_SENTRY_DSN vacío: este binario no enviará telemetría' }
          cargo build --release --locked -p orus-shell

      - name: Humo de la ventana con WebView2
        shell: pwsh
        run: pwsh -NoProfile -File scripts/smoke-windows.ps1 -Bin target\release\orus-shell.exe

      - name: Huella del binario
        shell: pwsh
        run: |
          $exe = 'target\release\orus-shell.exe'
          if (-not (Test-Path $exe)) { throw "no se generó $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "sha256 $hash"
          "sha256 $hash" | Set-Content target\release\SHA256.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: oruscribe-shell-windows
          path: |
            target/release/orus-shell.exe
            target/release/SHA256.txt

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint de tests que se saltan
        run: python scripts/lint-tests.py

      - name: Frontend (tests y sintaxis)
        shell: bash
        run: bash scripts/test-frontend.sh

      # tao usa GTK3, wry usa WebKitGTK 4.1 y tray-icon el indicador de GTK3.
      # xvfb, xdotool, x11-apps e imagemagick son para el humo de la ventana.
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            pkg-config \
            xvfb \
            x11-apps \
            imagemagick \
            xdotool

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Pruebas
        run: cargo test --workspace --locked --no-fail-fast

      - name: Prueba real de la app contra el proveedor y un Sentry falso
        run: |
          cargo build -p orus-server -p fake-provider --locked
          python3 scripts/e2e-real.py

      - name: Prueba del propio humo con apps de mentira
        run: sh scripts/test-smoke-linux.sh

      - name: Compilar la app para Linux
        env:
          ORUSCRIBE_SENTRY_DSN: ${{ secrets.ORUSCRIBE_SENTRY_DSN }}
        run: |
          if [ -z "$ORUSCRIBE_SENTRY_DSN" ]; then echo "::warning::ORUSCRIBE_SENTRY_DSN vacío: este binario no enviará telemetría"; fi
          cargo build --release --locked -p orus-shell

      # Antes de armar el tar.gz: un WebView que no monta deja la ventana con
      # el fondo del tema y el humo lo detecta por el número de colores.
      # La pantalla se fija: el Xvfb de algunos hosts arranca con medidas
      # inválidas y la ventana existe pero no se puede capturar.
      - name: Humo de la ventana con el WebView montado
        run: |
          chmod +x scripts/smoke-linux.sh
          xvfb-run -a -s "-screen 0 1280x1024x24" scripts/smoke-linux.sh target/release/orus-shell

      - name: Armar el tar.gz
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p build/linux/pkg build/release
          objdump -T target/release/orus-shell |
            sed -n 's/.*GLIBC_\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' |
            sort -u -t. -k1,1n -k2,2n | tail -n 1 > build/linux/pkg/GLIBC_BASELINE.txt
          cp target/release/orus-shell build/linux/pkg/oruscribe-agente
          cp build/linux/install.sh build/linux/pkg/install.sh
          chmod +x build/linux/pkg/install.sh
          cp frontend/dist/logo-512.png build/linux/pkg/icon.png
          printf '%s\n' "$version" > build/linux/pkg/VERSION.txt
          tar -czf "build/release/oruscribe-agente-$version-linux-x86_64.tar.gz" -C build/linux/pkg .
          sha256sum "build/release/oruscribe-agente-$version-linux-x86_64.tar.gz" > build/release/SHA256-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: oruscribe-shell-linux
          path: |
            target/release/orus-shell
            build/release/oruscribe-agente-*-linux-x86_64.tar.gz
            build/release/SHA256-linux.txt
