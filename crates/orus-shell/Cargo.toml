[package]
name = "orus-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
orus-api = { path = "../orus-api" }
orus-app = { path = "../orus-app" }
orus-auth = { path = "../orus-auth" }
orus-config = { path = "../orus-config" }
orus-install = { path = "../orus-install" }
orus-server = { path = "../orus-server" }
async-trait.workspace = true
axum.workspace = true
hex.workspace = true
png = "0.18"
reqwest.workspace = true
tao = "0.37.2"
tokio.workspace = true
tray-icon = "0.26.1"
wry = "0.57.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
flate2.workspace = true
serde_json.workspace = true
serial_test.workspace = true
sha2.workspace = true
tar.workspace = true
temp-env.workspace = true
tempfile.workspace = true

# Solo en compilación: embebe el logo en el exe para la barra de tareas y los
# accesos. En otros sistemas el build.rs no compila el recurso.
[build-dependencies]
winresource = "0.1"
